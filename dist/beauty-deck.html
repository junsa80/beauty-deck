<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#140b1f">
<meta name="description" content="미녀 덱: 밤의 여왕 — 모바일 덱빌딩 로그라이트. 4명의 히로인, 111장의 카드, 3막+종막.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="미녀 덱">
<title>미녀 덱: 밤의 여왕</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* 미녀 덱: 밤의 여왕 — 스타일 (모바일 세로 우선) */
:root {
  --bg: #140b1f; --bg2: #21122f; --panel: #2a1840; --line: #4a2f66; --text: #f5eefc; --dim: #b9a8cc;
  --gold: #ffd36e; --pink: #ff6fa8; --red: #ff4d6d; --blue: #6fb6ff; --green: #6fe39a; --purple: #b98cff;
  --atk: #ff6b6b; --skill: #5fb7ff; --power: #ffc857; --status: #888;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }
body { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
#app { position: relative; max-width: 480px; margin: 0 auto; height: 100dvh; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
  background: radial-gradient(120% 80% at 50% 0%, #3a1d55 0%, var(--bg) 60%); overflow: hidden; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; }

/* ── 버튼 ── */
.btn { min-height: 48px; padding: 10px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel);
  font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: linear-gradient(180deg, #ff7cb0, #d63d7e); border-color: #ff9cc4; box-shadow: 0 4px 16px #d63d7e55; }
.btn.gold { background: linear-gradient(180deg, #ffe08a, #c9962b); color: #2a1600; border-color: #ffe9a8; }
.btn.ghost { background: transparent; }
.btn:disabled, .btn.disabled { opacity: .45; filter: grayscale(.6); }
.btn:active { transform: scale(.97); }
.btn.block { width: 100%; }
.col { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; }
.center { text-align: center; }
.pad { padding: 16px; }
.dim { color: var(--dim); }
.small { font-size: 13px; }
h1, h2, h3 { margin: 0; }

/* ── 상단 바 ── */
.topbar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; padding-top: max(6px, env(safe-area-inset-top));
  background: #0d0716cc; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 700; flex-shrink: 0; }
.topbar .tb { min-width: 44px; min-height: 40px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; gap: 3px; padding: 0 4px; border-radius: 10px; }
.topbar .tb:active { background: #ffffff14; }
.topbar .sp { flex: 1; }
.potion-slot { width: 34px; height: 34px; min-width: 34px !important; border: 1px dashed #6b4d8a !important; border-radius: 10px; font-size: 18px; }
.potion-slot.full { border-style: solid !important; background: #3a2456 !important; }
.relicbar { display: flex; gap: 4px; padding: 4px 8px; overflow-x: auto; background: #0d071688; border-bottom: 1px solid #2c1c40; flex-shrink: 0; min-height: 36px; }
.relic { min-width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #2d1b44; border: 1px solid var(--line); font-size: 17px; }

/* ── 초상(플레이스홀더 + 이미지 훅) ── */
.portrait { position: relative; border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center;
  font-weight: 900; color: #fff; text-shadow: 0 2px 6px #0008; }
.portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.portrait .glyph { position: relative; }
.portrait::after { content: ""; position: absolute; inset: 0; background: radial-gradient(80% 60% at 30% 20%, #ffffff40, transparent 60%); pointer-events: none; }

/* ── 카드 ── */
.card { position: relative; width: 100px; height: 146px; border-radius: 12px; padding: 4px; flex-shrink: 0; display: flex; flex-direction: column;
  background: linear-gradient(180deg, #3b2457, #22143a); border: 2px solid #6b4d8a; box-shadow: 0 4px 10px #0007; transition: transform .15s, box-shadow .15s; }
.card.t-attack { border-color: var(--atk); }
.card.t-skill { border-color: var(--skill); }
.card.t-power { border-color: var(--power); }
.card.t-status { border-color: #777; background: linear-gradient(180deg, #3a3a3a, #222); }
.card.r-uncommon { box-shadow: 0 0 0 1px #6fb6ff88, 0 4px 10px #0007; }
.card.r-rare { box-shadow: 0 0 0 2px #ffd36ecc, 0 0 14px #ffd36e55, 0 4px 10px #0007; }
.card .cost { position: absolute; top: -6px; left: -6px; width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6, #3b86ff 45%, #1b3c94);
  border: 2px solid #cfe3ff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; z-index: 2; text-shadow: 0 1px 2px #000; }
.card .cost.cheaper { color: var(--green); }
.card .art { height: 52px; border-radius: 8px; font-size: 22px; flex-shrink: 0; }
.card .cname { font-size: 12.5px; font-weight: 800; text-align: center; margin-top: 3px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.up .cname { color: var(--green); }
.card .chero { font-size: 9.5px; text-align: center; color: var(--dim); line-height: 1.2; }
.card .cdesc { font-size: 10.5px; line-height: 1.25; text-align: center; flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 1px; word-break: keep-all; }
.card .cdesc b.up { color: var(--green); } .card .cdesc b.down { color: var(--red); }
.card .ctype { position: absolute; bottom: 2px; right: 6px; font-size: 9px; color: var(--dim); }
.card.big { width: 200px; height: 292px; padding: 8px; border-radius: 18px; }
.card.big .art { height: 110px; font-size: 44px; border-radius: 12px; }
.card.big .cname { font-size: 20px; margin-top: 6px; }
.card.big .chero { font-size: 13px; }
.card.big .cdesc { font-size: 15px; line-height: 1.4; }
.card.big .cost { width: 44px; height: 44px; font-size: 22px; top: -10px; left: -10px; }
.card.big .ctype { font-size: 12px; }
.card .cquote { display: none; }
.card.big .cquote { display: block; font-size: 12px; color: var(--pink); text-align: center; font-style: italic; margin-bottom: 14px; }
.card.unplayable { filter: grayscale(.7) brightness(.75); }
.card.playable { box-shadow: 0 0 0 2px #7dffb0aa, 0 0 12px #7dffb055; }

/* ── 손패 ── */
.hand { position: relative; height: 172px; flex-shrink: 0; display: flex; justify-content: center; align-items: flex-end; padding: 0 6px 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
.hand .card { margin-left: var(--ov, 2px); }
.hand .card:first-child { margin-left: 0; }
.hand .card.sel { transform: translateY(-46px) scale(1.28); z-index: 50; box-shadow: 0 0 0 3px #fff, 0 10px 26px #000c; }

/* ── 전투 ── */
.battle { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
.enemies { flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px; padding: 8px 6px 0; min-height: 0; }
.enemy { position: relative; flex: 1; max-width: 150px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; border-radius: 16px; border: 2px solid transparent; transition: opacity .4s, transform .2s; }
.enemy .portrait { width: 92px; height: 108px; font-size: 38px; border-radius: 18px; border: 2px solid #0006; }
.enemies.n3 .enemy .portrait { width: 76px; height: 90px; font-size: 30px; }
.enemy.boss .portrait { width: 132px; height: 150px; font-size: 54px; }
.enemy.targetable { border-color: #ff6fa877; background: #ff6fa812; animation: pulse 1.2s infinite; }
.enemy.dead { opacity: 0; pointer-events: none; }
.enemy.dying { animation: dying .8s forwards; pointer-events: none; }
.ename { font-size: 12px; font-weight: 800; text-align: center; line-height: 1.15; word-break: keep-all; }
.intent { min-height: 26px; display: flex; gap: 4px; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; padding: 2px 8px; border-radius: 12px; background: #0008; }
.intent .atk { color: #ff8b8b; } .intent .def { color: var(--blue); } .intent .buff { color: var(--gold); } .intent .debuff { color: var(--purple); }
.hpbar { position: relative; width: 100%; max-width: 130px; height: 16px; border-radius: 8px; background: #000a; overflow: hidden; border: 1px solid #0008; }
.hpbar .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg, #ff6b81, #c3123f); transition: width .4s; }
.hpbar .txt { position: absolute; inset: 0; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-shadow: 0 1px 2px #000; }
.hpbar.blocked { border-color: var(--blue); box-shadow: 0 0 6px var(--blue); }
.blockbadge { position: absolute; left: -12px; top: -4px; width: 26px; height: 24px; background: #2c6cd6; border: 2px solid #bfe0ff; border-radius: 8px 8px 12px 12px; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; z-index: 2; }
.hpwrap { position: relative; width: 100%; max-width: 130px; display: flex; justify-content: center; }
.chips { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; min-height: 20px; }
.chip { font-size: 11px; padding: 1px 4px; border-radius: 8px; background: #000a; border: 1px solid #ffffff22; white-space: nowrap; }
.chip.debuff { border-color: #b98cff66; } .chip.buff { border-color: #ffd36e66; }
.player { display: flex; align-items: center; gap: 8px; padding: 6px 10px; margin: 0 8px; border-radius: 16px; background: #0006; position: relative; }
.player .portrait { width: 52px; height: 52px; font-size: 24px; border-radius: 50%; }
.player .pinfo { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.player .hpbar { max-width: none; }
.player .hpwrap { max-width: none; }
.controls { display: flex; align-items: center; gap: 6px; padding: 6px 8px 0; flex-shrink: 0; }
.energy { width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8, #ffb02e 40%, #b3500b); border: 3px solid #ffe2a8;
  display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 19px; color: #2b1100; box-shadow: 0 0 14px #ffb02e88; flex-shrink: 0; }
.energy.zero { filter: grayscale(.8) brightness(.7); }
.pilebtn { min-width: 48px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: #0007; font-size: 13px; font-weight: 800; }
.endturn { margin-left: auto; min-height: 48px; padding: 0 16px; border-radius: 14px; border: 2px solid #ffe9a8; background: linear-gradient(180deg, #ffd36e, #c98a1c); color: #2a1600; font-weight: 900; font-size: 16px; }
.endturn.glow { animation: pulse 1.2s infinite; }
.hint { flex: 1; font-size: 12px; color: var(--dim); text-align: center; line-height: 1.2; }
.playbtn { position: absolute; left: 50%; bottom: 196px; transform: translateX(-50%); z-index: 60; }

/* ── 지도 ── */
.map { position: relative; margin: 0 auto; }
.map svg { position: absolute; inset: 0; pointer-events: none; }
.node { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 2px solid #6b4d8a; background: #24153a;
  font-size: 21px; display: flex; align-items: center; justify-content: center; padding: 0; }
.node.visited { background: #4a2f66; opacity: .75; }
.node.current { border-color: #fff; box-shadow: 0 0 0 3px #ff6fa8; }
.node.avail { border-color: var(--gold); box-shadow: 0 0 12px #ffd36eaa; animation: pulse 1.1s infinite; }
.node.locked { opacity: .55; }
.node.boss { width: 76px; height: 76px; margin: -38px 0 0 -38px; font-size: 38px; border-color: var(--red); }
.floorlbl { position: absolute; left: 4px; font-size: 10px; color: #8e7aa8; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; justify-content: center; font-size: 12px; color: var(--dim); padding: 6px; flex-shrink: 0; background: #0d071688; }

/* ── 화면 공통 ── */
.title-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; padding: 24px; text-align: center; }
.logo { font-size: 40px; font-weight: 900; line-height: 1.1; background: linear-gradient(180deg, #fff, #ffb3d1 50%, #ff6fa8); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 12px #ff6fa866); }
.logo small { display: block; font-size: 16px; color: var(--gold); -webkit-text-fill-color: var(--gold); letter-spacing: 4px; margin-top: 6px; }
.title-heroes { display: flex; gap: 8px; margin: 8px 0; }
.title-heroes .portrait { width: 70px; height: 92px; font-size: 30px; }
.panel { background: #2a1840dd; border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.hero-pick { display: flex; gap: 12px; }
.hero-pick .portrait { width: 96px; height: 128px; font-size: 44px; flex-shrink: 0; }
.hero-pick h3 { font-size: 19px; }
.tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #0007; border: 1px solid var(--line); margin: 2px 2px 0 0; }
.quote { color: var(--pink); font-size: 13px; font-style: italic; }
.grid { display: flex; flex-wrap: wrap; gap: 14px 10px; justify-content: center; padding: 14px 8px; }
.list-btn { width: 100%; min-height: 56px; display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; }
.list-btn .ic { font-size: 26px; width: 34px; text-align: center; }
.list-btn.done { opacity: .4; }
.bubble-hero { display: flex; gap: 12px; align-items: flex-start; }
.bubble-hero .portrait { width: 84px; height: 110px; font-size: 36px; flex-shrink: 0; }
.bubble { position: relative; background: #fff; color: #2a1840; border-radius: 14px; padding: 10px 12px; font-size: 15px; line-height: 1.5; white-space: pre-line; }
.price { color: var(--gold); font-weight: 900; font-size: 14px; text-align: center; margin-top: 4px; }
.price.no { color: var(--red); }
.shopitem { display: flex; flex-direction: column; align-items: center; min-width: 100px; }
.shopitem.sold { opacity: .25; pointer-events: none; }
.sale { position: absolute; top: -8px; right: -8px; background: var(--red); color: #fff; font-size: 11px; font-weight: 900; padding: 2px 6px; border-radius: 8px; z-index: 3; }
.section-title { font-size: 14px; color: var(--gold); font-weight: 800; padding: 8px 16px 0; }
.bigicon { font-size: 64px; filter: drop-shadow(0 6px 14px #0009); }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 14px; text-align: left; }

/* ── 모달 / 토스트 / 연출 ── */
.modal-bg { position: fixed; inset: 0; background: #000b; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadein .15s; }
.modal { width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; background: var(--bg2); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.modal h2 { font-size: 19px; }
#toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); z-index: 300; pointer-events: none; display: flex; flex-direction: column; gap: 6px; align-items: center; width: 92%; max-width: 420px; }
.toast { background: #000d; border: 1px solid var(--line); color: #fff; padding: 10px 14px; border-radius: 14px; font-size: 14px; animation: toast 2.6s forwards; text-align: center; line-height: 1.4; }
#fxlayer { position: fixed; inset: 0; pointer-events: none; z-index: 150; overflow: hidden; }
.float { position: absolute; font-weight: 900; font-size: 26px; text-shadow: 0 2px 0 #000, 0 0 8px #000; animation: floatup .9s forwards; white-space: nowrap; transform: translate(-50%, -50%); }
.float.dmg { color: #fff; } .float.dmg.big { font-size: 34px; color: #ffdd57; }
.float.blk { color: var(--blue); font-size: 20px; } .float.heal { color: var(--green); } .float.st { color: var(--purple); font-size: 16px; } .float.act { color: #ffd0e0; font-size: 15px; }
.saybubble { position: absolute; background: #fff; color: #2a1840; padding: 8px 12px; border-radius: 14px; font-size: 13px; font-weight: 700; max-width: 240px; line-height: 1.4;
  transform: translate(-50%, -100%); animation: say 3.2s forwards; box-shadow: 0 6px 18px #000a; text-align: center; }
.saybubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; }
.banner { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: 30px; font-weight: 900; padding: 12px; background: linear-gradient(90deg, transparent, #000c, transparent);
  animation: banner 1.1s forwards; text-shadow: 0 0 12px #ff6fa8; }
.ghostcard { position: fixed; z-index: 160; pointer-events: none; transition: transform .35s ease-in, opacity .35s ease-in; }
.shake { animation: shake .35s; }
.flashred { animation: flashred .5s; }
.screenflash { position: absolute; inset: 0; background: #ff2e4d; animation: sflash .6s forwards; }

@keyframes pulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }
@keyframes floatup { 0% { opacity: 0; margin-top: 10px; } 15% { opacity: 1; margin-top: 0; } 100% { opacity: 0; margin-top: -60px; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
@keyframes flashred { 0% { filter: none; } 30% { filter: brightness(1.8) sepia(1) hue-rotate(-50deg) saturate(5); } 100% { filter: none; } }
@keyframes dying { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.7) translateY(20px); filter: grayscale(1); } }
@keyframes toast { 0% { opacity: 0; transform: translateY(8px); } 10%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
@keyframes say { 0% { opacity: 0; } 8%, 88% { opacity: 1; } 100% { opacity: 0; } }
@keyframes banner { 0% { opacity: 0; transform: scaleY(0); } 20%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }
@keyframes fadein { from { opacity: 0; } }
@keyframes sflash { 0% { opacity: .5; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition: none !important; } }
@media (max-height: 640px) {
  .enemy .portrait { width: 72px; height: 82px; font-size: 30px; }
  .enemy.boss .portrait { width: 100px; height: 110px; }
  .hand { height: 160px; }
}

.portrait.p-xl { width: 120px; height: 160px; font-size: 56px; flex-shrink: 0; }
.portrait.p-lg { width: 90px; height: 110px; font-size: 40px; flex-shrink: 0; }
/* v0.1 조정 */
.topbar .tb { white-space: nowrap; font-size: 13px; }
.enemies.n1 .enemy .portrait, .enemies.n2 .enemy .portrait { width: 112px; height: 132px; font-size: 46px; }
.enemies.n1 .enemy.boss .portrait { width: 150px; height: 176px; font-size: 64px; }
.enemies.n1 .enemy { max-width: 200px; }
.hand .card { transform-origin: 50% 100%; }
.hand .card.sel { transform: translateY(-34px) scale(1.25); }
.hand .card.sel:first-child { transform: translate(14px, -34px) scale(1.25); }
.hand .card.sel:last-child { transform: translate(-14px, -34px) scale(1.25); }
@media (max-height: 700px) {
  .enemies.n1 .enemy .portrait, .enemies.n2 .enemy .portrait { width: 84px; height: 96px; font-size: 34px; }
  .enemies.n1 .enemy.boss .portrait { width: 110px; height: 126px; }
}

/* ═════ v1.0 추가 ═════ */
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
.screen.enter { animation: scrIn .28s ease-out; }
.scr-map, .scr-rest, .scr-shop, .scr-event, .scr-treasure, .scr-reward, .scr-select { background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--actbg, #3a1d55) 70%, transparent), transparent 70%); }
.battle { background: radial-gradient(110% 60% at 50% 10%, color-mix(in srgb, var(--actbg, #3a1d55) 80%, transparent), transparent 75%); }
@keyframes scrIn { from { opacity: 0; transform: translateY(10px); } }
.sshake { animation: sshake .32s; } .sshake2 { animation: sshake2 .5s; }
@keyframes sshake { 20% { transform: translate(-4px, 2px); } 40% { transform: translate(4px, -2px); } 60% { transform: translate(-3px, 1px); } 80% { transform: translate(2px, 0); } }
@keyframes sshake2 { 10% { transform: translate(-9px, 4px); } 25% { transform: translate(8px, -5px); } 40% { transform: translate(-7px, 3px); } 55% { transform: translate(6px, -2px); } 70% { transform: translate(-4px, 1px); } 85% { transform: translate(2px, 0); } }

<script>
/* engine.js */
/* 미녀 덱: 밤의 여왕 — 게임 엔진 (DOM 없음, 브라우저/Node 공용) v1.0
 * 모든 게임 상태는 run 객체 하나에 들어 있고, JSON으로 그대로 저장/복원됩니다.
 * UI는 run.screen 값을 보고 화면을 그리며, run.fx 배열(연출 이벤트)을 소비합니다.
 * 영구 기록(meta)은 newMeta/recordRun/checkAchievements로 관리합니다.

(function (root) {
  'use strict';
  const D = (typeof module !== 'undefined' && module.exports && typeof require === 'function')
    ? require('./data.js') : root.BD_DATA;

  const WIDTH = 5;
  const HAND_MAX = 10;
  const BASE_ENERGY = 3;
  const BASE_DRAW = 5;
  const LAST_ACT = 4;

  // ───────── 난수 (시드 고정, 저장 가능) ─────────
  function rnd(run) {
    run.rng = (run.rng + 0x6D2B79F5) | 0;
    let t = run.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const ri = (run, a, b) => a + Math.floor(rnd(run) * (b - a + 1));
  const pick = (run, arr) => arr[Math.floor(rnd(run) * arr.length)];
  function shuffle(run, arr) {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd(run) * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  }
  function weighted(run, w) {
    const keys = Object.keys(w).filter(k => w[k] > 0);
    let total = keys.reduce((s, k) => s + w[k], 0), r = rnd(run) * total;
    for (const k of keys) { r -= w[k]; if (r < 0) return k; }
    return keys[keys.length - 1];
  }

  // ───────── 카드 ─────────
  const defCache = {};
  function cardDef(card) {
    const id = typeof card === 'string' ? card : card.id;
    const up = typeof card === 'string' ? false : !!card.up;
    const key = id + (up ? '+' : '');
    if (defCache[key]) return defCache[key];
    const base = D.CARDS[id];
    if (!base) throw new Error('Unknown card ' + id);
    const d = up && base.up ? Object.assign({}, base, base.up, { name: base.name + '+', upgraded: true, id }) : Object.assign({}, base, { id, upgraded: false });
    defCache[key] = d;
    return d;
  }
  const canUpgrade = card => !card.up && !!(D.CARDS[card.id] && D.CARDS[card.id].up);
  function newCard(run, id, up) { return { uid: run.nextUid++, id, up: !!up }; }
  function needsTarget(def) { return def.effects.some(e => ['dmg', 'apply', 'multiplyPoison', 'rawDmg', 'dmgBlock', 'dmgPoison'].includes(e.t)); }
  const isCollectible = c => !['token', 'status'].includes(c.cls);

  // ───────── 런 생성 ─────────
  function newRun(starterId, seed, opts) {
    opts = opts || {};
    const s = D.STARTERS[starterId];
    if (!s) throw new Error('Unknown starter ' + starterId);
    seed = (seed == null ? Math.floor(Math.random() * 2 ** 31) : seed) | 0;
    const asc = Math.max(0, Math.min(10, opts.asc | 0));
    const run = {
      v: 2, seed, rng: seed, nextUid: 1, starter: starterId, cls: s.cls, asc,
      unlocked: (opts.unlocked || []).slice(),
      hp: s.hp, maxHp: s.hp, gold: s.gold, deck: [], relics: [], potions: [null, null, null],
      act: 1, floor: 0, totalFloor: 0, pos: null, visited: [], map: null, screen: 'map', over: false, won: false,
      combat: null, rewards: null, shop: null, event: null, treasure: null, pending: null,
      removeCost: 75, lastEnc: null, eventsSeen: [], cardsSeen: [], enemiesSeen: [], relicsSeen: [], phoenixUsed: false,
      stats: { kills: 0, elites: 0, cardsPlayed: 0, dmgDealt: 0, turns: 0, maxHit: 0, maxCardsTurn: 0, maxPoison: 0, maxBlock: 0,
               potionsUsed: 0, bosses: [], flawlessElite: false, goldEarned: 0, maxGold: 0, maxRelics: 0 },
      fx: []

    s.deck.forEach(id => run.deck.push(newCard(run, id)));
    if (asc >= 7) run.deck.push(newCard(run, 'wound'));
    run.map = genMap(run, 1);
    addRelic(run, s.relic);
    return run;
  }

  // ───────── 지도 ─────────
  function genMap(run, act) {
    const FL = D.ACTS[act].floors;
    const nodes = {};
    const boss = { id: 'boss', floor: FL, col: 2, type: 'boss', next: [], prev: [] };
    if (FL === 1) { // 종막: 휴식 하나 → 최종 보스
      nodes['0-2'] = { id: '0-2', floor: 0, col: 2, type: 'rest', next: ['boss'], prev: [] };
      boss.prev.push('0-2'); nodes.boss = boss;
      return { nodes, floors: FL, width: WIDTH, act };
    }
    const edges = [];
    const get = (f, c) => nodes[f + '-' + c] || (nodes[f + '-' + c] = { id: f + '-' + c, floor: f, col: c, type: null, next: [], prev: [] });
    const starts = [];
    for (let p = 0; p < 5; p++) {
      let c = ri(run, 0, WIDTH - 1);
      if (p === 1) { let g = 0; while (c === starts[0] && g++ < 20) c = ri(run, 0, WIDTH - 1); }
      starts.push(c);
      for (let f = 0; f < FL; f++) {
        const n = get(f, c);
        if (f === FL - 1) break;
        const opts = shuffle(run, [-1, 0, 1].map(d => c + d).filter(x => x >= 0 && x < WIDTH));
        let nc = c;
        for (const o of opts) {
          const cross = edges.some(([ef, a, b]) => ef === f && (a - c) * (b - o) < 0);
          if (!cross) { nc = o; break; }
        }
        const nxt = get(f + 1, nc);
        if (!n.next.includes(nxt.id)) { n.next.push(nxt.id); nxt.prev.push(n.id); edges.push([f, c, nc]); }
        c = nc;
      }
    }
    nodes.boss = boss;
    const order = Object.values(nodes).filter(n => n.id !== 'boss').sort((a, b) => a.floor - b.floor);
    const treasureFloor = Math.floor(FL / 2);
    const eliteFrom = act === 1 ? 3 : 2;
    for (const n of order) {
      if (n.floor === 0) n.type = 'monster';
      else if (n.floor === treasureFloor) n.type = 'treasure';
      else if (n.floor === FL - 1) n.type = 'rest';
      else {
        const w = { monster: 45, event: 22, elite: n.floor >= eliteFrom ? (run.asc >= 1 ? 13 : 11) : 0, rest: n.floor >= 3 && n.floor !== FL - 2 ? 11 : 0, shop: n.floor >= 2 ? 9 : 0 };
        let t, tries = 0;
        do { t = weighted(run, w); tries++; }
        while (tries < 20 && ['elite', 'rest', 'shop'].includes(t) && n.prev.some(pid => nodes[pid].type === t));
        n.type = t;
      }
      if (n.floor === FL - 1) { n.next = ['boss']; boss.prev.push(n.id); }
    }
    return { nodes, floors: FL, width: WIDTH, act };
  }
  function availableNodes(run) {
    if (run.screen !== 'map') return [];
    if (!run.pos) return Object.values(run.map.nodes).filter(n => n.floor === 0).map(n => n.id);
    return run.map.nodes[run.pos].next.slice();
  }
  function chooseNode(run, id) {
    if (!availableNodes(run).includes(id)) return { ok: false, reason: '갈 수 없는 칸이야.' };
    const n = run.map.nodes[id];
    run.pos = id; run.visited.push(id); run.floor = n.floor + 1; run.totalFloor++;
    const enc = D.ENCOUNTERS[run.act];
    switch (n.type) {
      case 'monster': {
        const easyUntil = run.act === 1 ? 3 : 2;
        const pool = enc[n.floor < easyUntil ? 'easy' : 'normal'];
        let e, g = 0;
        do { e = pick(run, pool); } while (g++ < 10 && run.lastEnc && e.join() === run.lastEnc);
        run.lastEnc = e.join();
        startCombat(run, e, 'monster'); break;
      }
      case 'elite': {
        let e, g = 0;
        do { e = pick(run, enc.elite); } while (g++ < 10 && run.lastElite && e.join() === run.lastElite);
        run.lastElite = e.join();
        startCombat(run, e, 'elite'); break;
      }
      case 'boss': startCombat(run, pick(run, enc.boss), 'boss'); break;
      case 'rest': run.screen = 'rest'; break;
      case 'shop': run.shop = genShop(run); run.screen = 'shop'; break;
      case 'treasure': run.treasure = { relic: randomRelic(run), gold: ri(run, 30, 50), opened: false }; run.screen = 'treasure'; break;
      case 'event': {
        const all = Object.keys(D.EVENTS).filter(k => !D.EVENTS[k].acts || D.EVENTS[k].acts.includes(run.act));
        let pool = all.filter(k => !run.eventsSeen.includes(k));
        if (!pool.length) pool = all;
        const eid = pick(run, pool);
        run.eventsSeen.push(eid);
        run.event = { id: eid, done: false, text: null };
        run.screen = 'event'; break;
      }
    }
    return { ok: true };
  }

  // ───────── 유물 / 물약 ─────────
  const hasRelic = (run, id) => run.relics.includes(id);
  function addRelic(run, id) {
    if (!id || hasRelic(run, id)) return;
    run.relics.push(id);
    if (!run.relicsSeen.includes(id)) run.relicsSeen.push(id);
    run.stats.maxRelics = Math.max(run.stats.maxRelics, run.relics.length);
    if (id === 'blood_rose') { run.maxHp += 10; run.hp = Math.min(run.maxHp, run.hp + 10); }
    if (id === 'b_giant') { run.maxHp += 30; run.hp = run.maxHp; }
    if (id === 'potion_belt') run.potions.push(null, null);
    if (id === 'whetstone' || id === 'war_paint') {
      const type = id === 'whetstone' ? 'attack' : 'skill';
      const ups = shuffle(run, run.deck.filter(c => canUpgrade(c) && D.CARDS[c.id].type === type));
      ups.slice(0, 2).forEach(c => { c.up = true; });
    }
  }
  function randomRelic(run) {
    const pool = Object.keys(D.RELICS).filter(k => !D.RELICS[k].starter && !D.RELICS[k].boss && !hasRelic(run, k));
    return pool.length ? pick(run, pool) : null;
  }
  function bossRelicChoices(run) {
    const pool = shuffle(run, Object.keys(D.RELICS).filter(k => D.RELICS[k].boss && !hasRelic(run, k)));
    return pool.slice(0, 3);
  }
  function randomPotion(run) { return pick(run, Object.keys(D.POTIONS)); }
  function addPotion(run, id) {
    const i = run.potions.indexOf(null);
    if (i < 0) return false;
    run.potions[i] = id; return true;
  }

  // ───────── 카드 보상 ─────────
  function cardPool(run, rarity) {
    return Object.keys(D.CARDS).filter(k => {
      const c = D.CARDS[k];
      if (!(c.cls === run.cls || c.cls === 'neutral')) return false;
      if (c.rarity === 'legend') return rarity === 'rare' && run.unlocked.includes(k);
      return c.rarity === rarity;
    });
  }
  function rollRarity(run, kind) {
    const w = kind === 'boss' ? { rare: 100 } : kind === 'elite' ? { common: 50, uncommon: 38, rare: 12 } : kind === 'shop' ? { common: 50, uncommon: 37, rare: 13 } : { common: 60, uncommon: 33, rare: 7 };
    return weighted(run, w);
  }
  function rewardCount(run) { return Math.max(1, 3 + (hasRelic(run, 'crystal_ball') ? 1 : 0) - (hasRelic(run, 'b_crown') ? 1 : 0)); }
  function genCardChoices(run, n, kind) {
    const out = [];
    let guard = 0;
    while (out.length < n && guard++ < 100) {
      const id = pick(run, cardPool(run, rollRarity(run, kind)));
      if (id && !out.includes(id)) out.push(id);
    }
    out.forEach(id => seeCard(run, id));
    // 3막부터는 가끔 강화된 카드
    return out.map(id => ({ id, up: run.act >= 3 && rnd(run) < 0.25 }));
  }
  function seeCard(run, id) { if (!run.cardsSeen.includes(id)) run.cardsSeen.push(id); }
  // 조합 힌트: 덱과 겹치는 아키타입 수
  function synergy(run, id) {
    const c = D.CARDS[id]; if (!c || !c.tags || !c.tags.length) return { score: 0, tags: [] };
    const counts = {};
    for (const cd of run.deck) for (const t of (D.CARDS[cd.id].tags || [])) counts[t] = (counts[t] || 0) + 1;
    const tags = c.tags.map(t => ({ t, n: counts[t] || 0 })).sort((a, b) => b.n - a.n);
    return { score: tags.reduce((s, x) => s + x.n, 0), tags };
  }

  // ───────── 전투 ─────────
  const C = run => run.combat;
  function hpOf(run, x) { return x.isPlayer ? run.hp : x.hp; }
  function setHp(run, x, v) { if (x.isPlayer) run.hp = v; else x.hp = v; }
  function addSt(x, s, v) {
    const n = (x.st[s] || 0) + v;
    if (n === 0 || (n < 0 && s !== 'str' && s !== 'dex')) delete x.st[s]; else x.st[s] = n;
  }
  function fx(run, e) { run.fx.push(e); }
  const whoId = x => x.isPlayer ? 'p' : x.uid;

  function mkEnemy(run, id, minion) {
    const d = D.ENEMIES[id];
    let hp = ri(run, d.hp[0], d.hp[1]);
    const a = run.asc || 0;
    if (d.kind === 'elite' && a >= 1) hp = Math.round(hp * 1.15);
    if ((d.kind === 'monster' || d.kind === 'rival') && a >= 2) hp = Math.round(hp * 1.1);
    if (d.boss && a >= 3) hp = Math.round(hp * 1.1);
    const e = { uid: run.nextUid++, id, name: d.name, hp, maxHp: hp, block: 0, st: Object.assign({}, d.start || {}),
             phase: 0, firstDone: false, cyc: 0, hist: [], intent: null, dead: false, minion: !!minion,
             dmgMul: (a >= 4 ? 1.1 : 1) * (d.boss && a >= 10 ? 1 : 1) };
    if (d.boss && a >= 10) addSt(e, 'str', 2);
    if (!run.enemiesSeen.includes(id)) run.enemiesSeen.push(id);
    return e;
  }
  function startCombat(run, ids, kind, opts) {
    const c = run.combat = {
      kind, enemies: ids.map(id => mkEnemy(run, id)), draw: [], hand: [], disc: [], exh: [],
      energy: 0, p: { isPlayer: true, block: 0, st: {} }, turn: 0, atkThisTurn: 0, skillThisTurn: 0, cardsThisTurn: 0,
      cardsTotal: 0, dmgTaken: 0, over: false, fromEvent: !!(opts && opts.fromEvent)
    };
    const deck = shuffle(run, run.deck.map(cd => ({ uid: cd.uid, id: cd.id, up: cd.up })));
    const innate = deck.filter(cd => cardDef(cd).innate), rest = deck.filter(cd => !cardDef(cd).innate);
    c.draw = rest.concat(innate);
    run.screen = 'combat';
    run.rewards = null;
    for (const e of c.enemies) { const d = D.ENEMIES[e.id]; if (d.intro) fx(run, { k: 'say', who: e.uid, text: d.intro }); }
    const P = c.p;
    if (hasRelic(run, 'shadow_hood')) for (let i = 0; i < 3; i++) c.hand.push(newCard(run, 'shiv'));
    if (hasRelic(run, 'b_mask')) for (let i = 0; i < 2; i++) c.hand.push(newCard(run, 'daze'));
    if (hasRelic(run, 'guard_charm')) P.block += 10;
    if (hasRelic(run, 'holy_sigil')) { P.block += 4; addSt(P, 'thorns', 1); }
    if (hasRelic(run, 'dragon_heart')) addSt(P, 'str', 1);
    if (hasRelic(run, 'silk_glove')) addSt(P, 'dex', 1);
    if (hasRelic(run, 'thorn_crown')) addSt(P, 'thorns', 3);
    if (hasRelic(run, 'holy_water')) addSt(P, 'regen', 4);
    if (hasRelic(run, 'venom_vial')) addSt(P, 'toxin', 1);
    if (hasRelic(run, 'glowstick')) addSt(P, 'vigor', 8);
    if (hasRelic(run, 'viper_fang')) c.enemies.forEach(e => addSt(e, 'vuln', 1));
    if (hasRelic(run, 'mirror_shard')) c.enemies.forEach(e => addSt(e, 'weak', 1));
    trackBlock(run);
    c.enemies.forEach(e => chooseIntent(run, e));
    startPlayerTurn(run);
  }

  function phaseOf(d, e) { return d.phases ? d.phases[e.phase] : d; }
  function chooseIntent(run, e) {
    const d = D.ENEMIES[e.id];
    const ai = phaseOf(d, e).ai;
    const c = C(run);
    const alive = c.enemies.filter(x => !x.dead).length;
    const ok = k => !(d.moves[k].summon && alive >= 3);
    let key;
    if (!e.firstDone && ai.first) { key = ai.first; e.firstDone = true; }
    else if (ai.type === 'cycle') {
      for (let g = 0; g < ai.order.length; g++) { key = ai.order[e.cyc % ai.order.length]; e.cyc++; if (ok(key)) break; }
    } else {
      const w = Object.assign({}, ai.w);
      for (const k of Object.keys(w)) {
        const max = (ai.maxRun && ai.maxRun[k]) || 2;
        let run_ = 0; for (let i = e.hist.length - 1; i >= 0 && e.hist[i] === k; i--) run_++;
        if (run_ >= max || !ok(k)) w[k] = 0;
      }
      key = Object.values(w).some(v => v > 0) ? weighted(run, w) : Object.keys(ai.w).find(ok) || Object.keys(ai.w)[0];
    }
    e.firstDone = true;
    e.intent = key;
  }

  // src: 공격자, tgt: 대상, base: 기본 피해, o: { vigor, strMult, bonusIfWeak, shiv }
  function calcAttack(src, tgt, base, o) {
    o = typeof o === 'number' ? { vigor: o } : (o || {});
    const str = (src.st.str || 0) * (o.strMult || 1);
    let d = base + str + (o.vigor || 0) + (o.shiv && src.st.bladeDance ? src.st.bladeDance : 0) + (o.bonusIfWeak && tgt && tgt.st.weak ? o.bonusIfWeak : 0);
    if (src.dmgMul) d *= src.dmgMul;
    if (src.st.weak) d *= 0.75;
    if (tgt && tgt.st.vuln) d *= 1.5;
    return Math.max(0, Math.floor(d));
  }
  function trackBlock(run) { const c = C(run); if (c) run.stats.maxBlock = Math.max(run.stats.maxBlock, c.p.block); }
  function gainBlock(run, x, v) { if (v <= 0) return; x.block += v; fx(run, { k: 'block', who: whoId(x), v }); if (x.isPlayer) trackBlock(run); }
  function playerBlock(run, v) { const c = C(run); gainBlock(run, c.p, Math.max(0, v + (c.p.st.dex || 0))); }

  function applyDamage(run, tgt, amount, src, isAttack) {
    if (!tgt || (!tgt.isPlayer && tgt.dead) || run.over) return 0;
    const blocked = Math.min(tgt.block, amount);
    tgt.block -= blocked;
    const lose = Math.min(amount - blocked, hpOf(run, tgt));
    setHp(run, tgt, hpOf(run, tgt) - lose);
    fx(run, { k: 'dmg', who: whoId(tgt), v: amount - blocked, blocked, big: amount >= 20 });
    if (src && src.isPlayer && !tgt.isPlayer) { run.stats.dmgDealt += lose; if (isAttack) run.stats.maxHit = Math.max(run.stats.maxHit, amount); }
    if (tgt.isPlayer && lose > 0) C(run).dmgTaken += lose;
    if (!tgt.isPlayer && tgt.st.curl && lose > 0 && !tgt.dead) { const v = tgt.st.curl; delete tgt.st.curl; tgt.block += v; fx(run, { k: 'block', who: tgt.uid, v }); }
    afterHpChange(run, tgt);
    if (run.over) return lose;
    if (isAttack && src && tgt.st.thorns && !src.dead) applyDamage(run, src, tgt.st.thorns, tgt, false);
    if (isAttack && tgt.isPlayer && src && !src.isPlayer && !src.dead && amount > 0 && amount === blocked && tgt.st.retribution) applyDamage(run, src, tgt.st.retribution, tgt, false);
    if (isAttack && src && src.isPlayer && lose > 0 && src.st.envenom && !tgt.dead) addPoison(run, tgt, src.st.envenom);
    return lose;
  }
  function addPoison(run, t, v) {
    const P = C(run).p;
    addSt(t, 'poison', v + (P.st.toxin || 0));
    run.stats.maxPoison = Math.max(run.stats.maxPoison, t.st.poison || 0);
  }
  function loseHp(run, tgt, v, fromCard) {
    if (run.over) return;
    const lose = Math.min(v, hpOf(run, tgt));
    setHp(run, tgt, hpOf(run, tgt) - lose);
    fx(run, { k: 'dmg', who: whoId(tgt), v: lose, blocked: 0, poison: !fromCard });
    if (tgt.isPlayer && C(run)) C(run).dmgTaken += lose;
    afterHpChange(run, tgt);
    if (fromCard && tgt.isPlayer && tgt.st.rupture && !run.over) { addSt(tgt, 'str', tgt.st.rupture); fx(run, { k: 'buff', who: 'p', s: 'str' }); }
  }
  function tryRevive(run) {
    const pi = run.potions.indexOf('fairy_p');
    if (pi >= 0) { run.potions[pi] = null; run.hp = Math.max(1, Math.floor(run.maxHp * 0.3)); fx(run, { k: 'revive', how: 'fairy' }); return true; }
    if (hasRelic(run, 'b_phoenix') && !run.phoenixUsed) { run.phoenixUsed = true; run.hp = Math.floor(run.maxHp * 0.5); fx(run, { k: 'revive', how: 'phoenix' }); return true; }
    return false;
  }
  function afterHpChange(run, x) {
    if (x.isPlayer) { if (run.hp <= 0 && !tryRevive(run)) endRun(run, false); return; }
    const d = D.ENEMIES[x.id];
    if (x.hp <= 0 && !x.dead) {
      x.dead = true; x.block = 0; run.stats.kills++;
      fx(run, { k: 'die', who: x.uid, boss: !!d.boss });
      if (d.death) fx(run, { k: 'say', who: x.uid, text: d.death });
      if (d.boss) {
        if (!run.stats.bosses.includes(x.id)) run.stats.bosses.push(x.id);
        C(run).enemies.forEach(e => { if (e.minion && !e.dead) { e.dead = true; e.hp = 0; fx(run, { k: 'die', who: e.uid }); } });
      }
      return;
    }
    if (d.phases && d.phases[x.phase + 1] && x.hp <= x.maxHp * d.phases[x.phase + 1].at) {
      x.phase++;
      const ph = d.phases[x.phase], en = ph.enter || {};
      if (en.say) fx(run, { k: 'say', who: x.uid, text: en.say });
      if (en.clearDebuffs) for (const s of Object.keys(x.st)) if (D.STATUS[s] && D.STATUS[s].type === 'debuff') delete x.st[s];
      if (en.st) for (const s in en.st) addSt(x, s, en.st[s]);
      if (en.block) x.block += en.block;
      x.firstDone = false; x.cyc = 0;
      chooseIntent(run, x);
      fx(run, { k: 'phase', who: x.uid, n: x.phase + 1 });
    }
  }

  function drawCards(run, n) {
    const c = C(run);
    for (let i = 0; i < n; i++) {
      if (c.hand.length >= HAND_MAX) break;
      if (!c.draw.length) {
        if (!c.disc.length) break;
        c.draw = shuffle(run, c.disc); c.disc = [];
        fx(run, { k: 'shuffle' });
      }
      const cd = c.draw.pop();
      c.hand.push(cd);
      if (cd.id === 'burn' && c.p.st.pyro) aliveEnemies(run).forEach(t => applyDamage(run, t, c.p.st.pyro, c.p, false));
      if (run.over || c.over) return;
    }
  }

  function startPlayerTurn(run) {
    const c = C(run);
    if (run.over || c.over) return;
    const P = c.p;
    c.turn++; run.stats.turns++;
    c.atkThisTurn = 0; c.skillThisTurn = 0; c.cardsThisTurn = 0;
    if (c.turn > 1 && !P.st.barricade) P.block = 0;
    if (P.st.poison) { const p = P.st.poison; addSt(P, 'poison', -1); loseHp(run, P, p); if (run.over) return; }
    if (P.st.ritual) addSt(P, 'str', P.st.ritual);
    if (P.st.sanctuary) gainBlock(run, P, P.st.sanctuary);
    if (P.st.blessing) healPlayer(run, P.st.blessing);
    if (P.st.permafrost) aliveEnemies(run).forEach(e => addSt(e, 'weak', P.st.permafrost));
    if (P.st.shivGen) for (let i = 0; i < P.st.shivGen && c.hand.length < HAND_MAX; i++) c.hand.push(newCard(run, 'shiv'));
    const bossE = ['b_crown', 'b_ember', 'b_mask'].filter(r => hasRelic(run, r)).length;
    c.energy = BASE_ENERGY + bossE + (P.st.energyUp || 0)
      + (c.turn === 1 && hasRelic(run, 'moon_pendant') ? 1 : 0)
      + (c.turn % 3 === 0 && hasRelic(run, 'sun_pin') ? 1 : 0);
    drawCards(run, BASE_DRAW + (P.st.drawUp || 0) + (hasRelic(run, 'b_hourglass') ? 1 : 0)
      + (c.turn === 1 && hasRelic(run, 'firefly') ? 2 : 0) + (c.turn === 1 && hasRelic(run, 'moon_pendant') ? 1 : 0));
    fx(run, { k: 'turn', who: 'p', turn: c.turn });
    checkCombatEnd(run);
  }
  function maxEnergy(run) {
    const c = C(run); if (!c) return BASE_ENERGY;
    return BASE_ENERGY + ['b_crown', 'b_ember', 'b_mask'].filter(r => hasRelic(run, r)).length + (c.p.st.energyUp || 0);
  }

  function canPlay(run, card) {
    const c = C(run);
    if (!c || c.over || run.over) return false;
    const d = cardDef(card);
    if (d.unplayable) return false;
    if (d.cost === -1) return true;
    return c.energy >= d.cost;
  }

  function aliveEnemies(run) { return C(run).enemies.filter(e => !e.dead); }

  function runEffects(run, effects, target, ctx) {
    const c = C(run), P = c.p;
    const ao = e => ({ vigor: ctx.vigor, strMult: e.strMult, bonusIfWeak: e.bonusIfWeak, shiv: ctx.shiv });
    for (const e of effects) {
      if (run.over || c.over) return;
      switch (e.t) {
        case 'dmg': {
          const hits = e.hitsFrom === 'atk' ? c.atkThisTurn : e.hitsFrom === 'skill' ? c.skillThisTurn : (e.hits || 1);
          for (let h = 0; h < hits; h++) { if (!target || target.dead || run.over) break; applyDamage(run, target, calcAttack(P, target, e.v, ao(e)), P, true); }
          break;
        }
        case 'dmgAll': {
          const hits = e.hits === 'X' ? ctx.x : (e.hits || 1);
          for (let h = 0; h < hits; h++) for (const t of aliveEnemies(run)) { if (run.over) break; applyDamage(run, t, calcAttack(P, t, e.v, ao(e)), P, true); }
          break;
        }
        case 'dmgRandom': {
          for (let h = 0; h < (e.hits || 1); h++) { const al = aliveEnemies(run); if (!al.length || run.over) break; const t = pick(run, al); applyDamage(run, t, calcAttack(P, t, e.v, ao(e)), P, true); }
          break;
        }
        case 'dmgBlock': if (target && !target.dead) applyDamage(run, target, calcAttack(P, target, P.block, ao(e)), P, true); break;
        case 'dmgBlockAll': { const b = P.block; for (const t of aliveEnemies(run)) { if (run.over) break; applyDamage(run, t, calcAttack(P, t, b, ao(e)), P, true); } break; }
        case 'dmgPoison': if (target && !target.dead) applyDamage(run, target, Math.floor((target.st.poison || 0) * (e.m || 1)), P, false); break;
        case 'dmgAllThorns': { const v = (P.st.thorns || 0) * (e.m || 1); for (const t of aliveEnemies(run)) { if (run.over) break; applyDamage(run, t, calcAttack(P, t, v, ao(e)), P, true); } break; }
        case 'rawDmg': if (target && !target.dead) applyDamage(run, target, e.v, P, false); break;
        case 'rawDmgAll': for (const t of aliveEnemies(run)) { if (run.over) break; applyDamage(run, t, e.v, P, false); } break;
        case 'block': playerBlock(run, e.v); break;
        case 'blockDex': gainBlock(run, P, Math.max(0, (P.st.dex || 0) * e.m)); break;
        case 'rawBlock': gainBlock(run, P, e.v); break;
        case 'doubleBlock': gainBlock(run, P, P.block); break;
        case 'draw': drawCards(run, e.v); break;
        case 'energy': c.energy += e.v; break;
        case 'energyIfAtk': if (c.atkThisTurn + 1 >= e.n) c.energy += e.v; break; // 이 카드 포함
        case 'apply': if (target && !target.dead) { if (e.s === 'poison') addPoison(run, target, e.v); else addSt(target, e.s, e.v); fx(run, { k: 'debuff', who: target.uid, s: e.s }); } break;
        case 'applyAll': aliveEnemies(run).forEach(t => { if (e.s === 'poison') addPoison(run, t, e.v); else addSt(t, e.s, e.v); fx(run, { k: 'debuff', who: t.uid, s: e.s }); }); break;
        case 'self': addSt(P, e.s, e.v); fx(run, { k: 'buff', who: 'p', s: e.s }); break;
        case 'doubleStr': if (P.st.str > 0) { addSt(P, 'str', P.st.str); fx(run, { k: 'buff', who: 'p', s: 'str' }); } break;
        case 'heal': healPlayer(run, e.v); break;
        case 'loseHp': loseHp(run, P, e.v, true); break;
        case 'cleanse': for (const s of Object.keys(P.st)) if (D.STATUS[s] && D.STATUS[s].type === 'debuff') delete P.st[s]; fx(run, { k: 'buff', who: 'p', s: 'regen' }); break;
        case 'add':
          for (let i = 0; i < e.n; i++) {
            const nc = newCard(run, e.id, e.up);
            if (e.to === 'hand' && c.hand.length < HAND_MAX) c.hand.push(nc);
            else if (e.to === 'draw') c.draw.splice(ri(run, 0, c.draw.length), 0, nc);
            else c.disc.push(nc);
          }
          break;
        case 'upgradeHand': {
          const ups = c.hand.filter(canUpgrade);
          if (e.v === 'all') ups.forEach(cd => { cd.up = true; });
          else if (ups.length) pick(run, ups).up = true;
          break;
        }
        case 'multiplyPoison': if (target && !target.dead && target.st.poison) { target.st.poison *= e.v; run.stats.maxPoison = Math.max(run.stats.maxPoison, target.st.poison); fx(run, { k: 'debuff', who: target.uid, s: 'poison' }); } break;
        case 'exhaustBurns': {
          const burns = c.hand.filter(cd => cd.id === 'burn');
          c.hand = c.hand.filter(cd => cd.id !== 'burn'); burns.forEach(b => c.exh.push(b));
          for (let i = 0; i < burns.length; i++) for (const t of aliveEnemies(run)) { if (run.over) break; applyDamage(run, t, calcAttack(P, t, e.v, ao(e)), P, true); }

    if (f.upgrade && run.deck.some(canUpgrade)) { run.pending = { mode: 'upgrade', after: 'event', cancel: 'event' }; run.screen = 'select'; }
    if (f.remove && run.deck.length > 1) { run.pending = { mode: 'remove', after: 'event', cancel: 'event' }; run.screen = 'select'; }
    if (f.dup) { run.pending = { mode: 'dup', after: 'event', cancel: 'event' }; run.screen = 'select'; }
  }
  function chooseEvent(run, i) {
    const ev = run.event; if (run.screen !== 'event' || !ev || ev.done) return { ok: false };
    const opt = D.EVENTS[ev.id].options[i];
    if (!opt || !eventOptionOk(run, opt)) return { ok: false, reason: '조건이 맞지 않아.' };

  function leaveEvent(run) { if (run.screen !== 'event' || !run.event || !run.event.done) return { ok: false }; run.event = null; run.screen = 'map'; return { ok: true }; }

  // ───────── 영구 기록 / 해금 / 업적 ─────────
  function newMeta() {
    return { v: 2, runs: 0, wins: 0, bestFloor: 0, bestAct: 0, kills: 0, elites: 0, bosses: {}, heroWins: {}, heroRuns: {}, heroBestAsc: {},
             cardsSeen: [], relicsSeen: [], enemiesSeen: [], ach: {}, ascMax: 0, maxHit: 0, cardsPlayed: 0, dmgDealt: 0, potionsUsed: 0,
             goldEarned: 0, playMs: 0, tutorialDone: false, newGallery: [] };
  }
  function migrateMeta(m) {

    if (!Array.isArray(n.cardsSeen)) n.cardsSeen = [];

  }
  const GALLERY_REQ = { g_sera: 'win_sera', g_luna: 'win_luna', g_yuki: 'win_yuki', g_aria: 'win_aria', g_morgana: 'boss_morgana', g_belita: 'boss_belita',
    g_celes: 'boss_celes', g_nyx: 'boss_nyx', g_asc5: 'asc5', g_asc10: 'asc10', g_elite: 'elite10' };
  function galleryUnlocked(meta, gid) {
    if (gid === 'g_party') return ['win_sera', 'win_luna', 'win_yuki', 'win_aria'].every(a => meta.ach[a]);
    return !!meta.ach[GALLERY_REQ[gid]];
  }
  function heroUnlocked(meta, id) { const s = D.STARTERS[id]; return !s.locked || !!meta.ach.boss_belita; }
  function unlockedCards(meta) { return Object.keys(D.ACHIEVEMENTS).filter(a => meta.ach[a] && D.ACHIEVEMENTS[a].card).map(a => D.ACHIEVEMENTS[a].card); }
  function liveCount(meta, run, k) { return (meta[k] || 0) + (run && !run.recorded ? run.stats[k] : 0); }

      case 'win_sera': case 'win_luna': case 'win_yuki': case 'win_aria': return won && run.starter === id.slice(4);
      case 'boss_morgana': case 'boss_belita': case 'boss_celes': case 'boss_nyx': return !!s && s.bosses.includes(id.slice(5));
      case 'big_hit': return !!s && s.maxHit >= 40;
      case 'chain10': return !!s && s.maxCardsTurn >= 10;
      case 'poison30': return !!s && s.maxPoison >= 30;

      case 'kills100': return liveCount(meta, run, 'kills') >= 100;

      case 'relics12': return !!run && run.relics.length >= 12;

      case 'asc10': return won && run.asc >= 10;
      case 'collector': { const set = new Set(meta.cardsSeen.concat(run ? run.cardsSeen.concat(run.deck.map(c => c.id)) : [])); return [...set].filter(x => D.CARDS[x] && isCollectible(D.CARDS[x])).length >= 80; }
    }

  }
  // 새로 달성한 업적 id 목록을 돌려주고 meta에 기록
  function checkAchievements(meta, run) {
    const got = [];
    for (const id of Object.keys(D.ACHIEVEMENTS)) {
      if (meta.ach[id]) continue;

        meta.ach[id] = Date.now(); got.push(id);

      }

  }
  function recordRun(meta, run) {
    meta.runs++; meta.kills += run.stats.kills; meta.elites += run.stats.elites;
    meta.cardsPlayed += run.stats.cardsPlayed; meta.dmgDealt += run.stats.dmgDealt; meta.potionsUsed += run.stats.potionsUsed; meta.goldEarned += run.stats.goldEarned;

  // ───────── 카드 설명문 ─────────
  function josa(word, a, b) {

  // ctx: { p: 플레이어 엔티티(st), target } 가 있으면 실제 수치로 보여줌
  function describe(def, ctx) {

    };
    const S = s => D.STATUS[s].name;
    for (const e of def.effects) {
      switch (e.t) {
        case 'dmg': {
          let s;
          if (e.hitsFrom === 'atk') s = `이번 턴에 낸 공격 카드 1장당 피해 ${num(e.v, 'atk', e)}.`;
          else if (e.hitsFrom === 'skill') s = `이번 턴에 낸 스킬 카드 1장당 피해 ${num(e.v, 'atk', e)}.`;
          else s = (e.hits || 1) > 1 ? `피해 ${num(e.v, 'atk', e)}를 ${e.hits}번.` : `피해 ${num(e.v, 'atk', e)}.`;
          if (e.strMult) s += ` 힘이 ${e.strMult}배로 적용.`;
          if (e.bonusIfWeak) s += ` 약화된 적에겐 +${e.bonusIfWeak}.`;
          out.push(s); break;
        }
        case 'dmgAll': out.push(e.hits === 'X' ? `모든 적에게 피해 ${num(e.v, 'atk')}를 X번.` : (e.hits || 1) > 1 ? `모든 적에게 피해 ${num(e.v, 'atk')}를 ${e.hits}번.` : `모든 적에게 피해 ${num(e.v, 'atk')}.`); break;
        case 'dmgRandom': out.push(`무작위 적에게 피해 ${num(e.v, 'atk')}를 ${e.hits}번.`); break;
        case 'dmgBlock': out.push('현재 방어도만큼 피해.'); break;
        case 'dmgBlockAll': out.push('현재 방어도만큼 모든 적에게 피해.'); break;
        case 'dmgPoison': out.push(e.m > 1 ? `대상 중독 수치의 ${e.m}배만큼 피해.` : '대상 중독 수치만큼 피해.'); break;
        case 'dmgAllThorns': out.push(`가시 수치 ×${e.m}만큼 모든 적에게 피해.`); break;
        case 'block': out.push(`방어도 ${num(e.v, 'blk')}.`); break;
        case 'blockDex': out.push(`민첩 ×${e.m}만큼 방어도.`); break;
        case 'doubleBlock': out.push('방어도를 2배로.'); break;
        case 'draw': out.push(`카드 ${e.v}장 뽑기.`); break;
        case 'energy': out.push(`에너지 +${e.v}.`); break;
        case 'energyIfAtk': out.push(`이번 턴 공격 카드 ${e.n}장째면 에너지 +${e.v}.`); break;
        case 'apply': out.push(`${S(e.s)} ${e.v} 부여.`); break;
        case 'applyAll': out.push(`모든 적에게 ${S(e.s)} ${e.v}.`); break;
        case 'self': {
          const st = D.STATUS[e.s];
          out.push(st.power ? st.desc(e.v) : `${josa(st.name, '을', '를')} ${e.v} 얻음.`); break;
        }
        case 'doubleStr': out.push('힘을 2배로.'); break;
        case 'heal': out.push(`체력 ${e.v} 회복.`); break;
        case 'loseHp': out.push(`체력 ${e.v} 잃음.`); break;
        case 'cleanse': out.push('내 디버프 모두 제거.'); break;
        case 'add': out.push(`${josa(D.CARDS[e.id].name, '을', '를')} ${e.n}장 ${e.to === 'hand' ? '손에' : e.to === 'draw' ? '뽑을 카드에' : '버린 카드에'} 추가.`); break;
        case 'upgradeHand': out.push(e.v === 'all' ? '손의 모든 카드 강화.' : '손의 카드 1장 강화.'); break;
        case 'multiplyPoison': out.push(`대상의 중독을 ${e.v}배로.`); break;
        case 'exhaustBurns': out.push(`손의 「화상」을 모두 소멸시키고, 1장당 모든 적에게 피해 ${num(e.v, 'atk')}.`); break;
        case 'rawDmg': out.push(`피해 ${e.v}.`); break;
        case 'rawDmgAll': out.push(`모든 적에게 피해 ${e.v}.`); break;
        case 'rawBlock': out.push(`방어도 ${e.v}.`); break;
      }
    }
    if (def.text) out.push(def.text);
    const kw = [];
    if (def.innate) kw.push('선천성');

  // 강화 전후 차이: { cost:[a,b]|null, html } — 숫자가 바뀐 곳만 a→b로 강조

  const E = {
    D, LAST_ACT, rnd, cardDef, canUpgrade, needsTarget, isCollectible, newRun, genMap, availableNodes, chooseNode,
    canPlay, playCard, endTurn, usePotion, discardPotion, intentView, incomingDamage, calcAttack, aliveEnemies, maxEnergy,
    takeGold, takeCard, skipCard, takeRelic, takeBossRelic, takePotion, leaveReward, synergy, rewardCount,
    restHeal, restHealAmount, restSmith, selectableCards, selectCard, cancelSelect,
    buy, shopRemove, removePrice, leaveShop, openChest, leaveTreasure, chooseEvent, eventOptionOk, leaveEvent,
    newMeta, migrateMeta, recordRun, checkAchievements, heroUnlocked, unlockedCards, galleryUnlocked,

  };

  if (typeof module !== 'undefined' && module.exports) module.exports = E;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* ui.js */
/* 미녀 덱: 밤의 여왕 — 화면(UI)
 * engine.js의 run 상태를 보고 화면을 그립니다. 게임 규칙은 전부 engine.js에 있습니다.
 */
(function () {
  'use strict';
  const E = window.BD_ENGINE, D = window.BD_DATA, A = window.BD_ART;
  const SAVE_KEY = 'beautydeck.run.v2', META_KEY = 'beautydeck.meta.v2', OLD_META = 'beautydeck.meta.v1', SET_KEY = 'beautydeck.settings.v1';
  const app = document.getElementById('app');
  const fxLayer = document.getElementById('fxlayer');

  let run = null;
  let meta = loadMeta();
  const settings = Object.assign({ sound: false, vibe: true, reduce: false, fast: false, asc: 0 }, loadJSON(SET_KEY) || {});
  const ui = { view: 'title', sel: null, potionSel: null, busy: false, modal: null, hold: false, deadShown: new Set(), runAch: [], tut: 0, lastScreen: null, codexTab: 'cards', codexCls: 'all', modalStack: [] };

  // ───────── 저장 ─────────
  function loadJSON(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 공간 문제는 무시 */ } }

  }
  function saveMeta() { saveJSON(META_KEY, meta); }
  function saveSettings() { saveJSON(SET_KEY, settings); applySettings(); }

      try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 무시 */ }
    } else saveJSON(SAVE_KEY, JSON.parse(JSON.stringify(run, (k, v) => (k === 'fx' ? undefined : v))));
  }

    const got = E.checkAchievements(meta, run);

      const a = D.ACHIEVEMENTS[id]; ui.runAch.push(id);
      toast(`🏆 업적 달성! <b>${esc(a.icon + ' ' + a.name)}</b>${a.card ? `<br><span class="small">전용 카드 「${esc(D.CARDS[a.card].name)}」 해금</span>` : ''}${id === 'boss_belita' ? '<br><span class="small">새 히로인 <b>아리아</b> 합류!</span>' : ''}`, 3600);

  }
  function applySettings() {

  }

  // ───────── 소리 / 진동 ─────────
  let actx = null;

        tap: () => tone(660, 0.05, 'triangle', 0.06),
        card: () => tone(520, 0.08, 'triangle', 0.08, 880),
        hit: () => { noise(0.12, 0.18); tone(180, 0.12, 'square', 0.06, 90); },
        big: () => { noise(0.25, 0.25); tone(120, 0.3, 'sawtooth', 0.08, 50); },
        hurt: () => { noise(0.15, 0.2); tone(140, 0.2, 'square', 0.07, 70); },
        block: () => tone(300, 0.1, 'triangle', 0.1, 420),
        heal: () => { tone(523, 0.12, 'sine', 0.08); tone(784, 0.18, 'sine', 0.08, null, 0.08); },
        buff: () => tone(440, 0.15, 'sine', 0.07, 660),
        win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'triangle', 0.09, null, i * 0.09)),
        lose: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, 'sine', 0.09, null, i * 0.14)),
        ach: () => [784, 988, 1175].forEach((f, i) => tone(f, 0.16, 'triangle', 0.08, null, i * 0.07)),
        coin: () => { tone(988, 0.06, 'square', 0.05); tone(1319, 0.12, 'square', 0.05, null, 0.06); },

  // ───────── 유틸 ─────────
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function toast(msg, ms) {

    if (ms) t.style.animationDuration = ms + 'ms';

  }
  const HAIR = { sera: 1, luna: 0, yuki: 2, aria: 3 };
  function heroInfo(hid, kind, extra) {
    const h = D.HEROINES[hid];
    return Object.assign({ kind, woman: true, c1: h ? h.colors[0] : '#888', c2: h ? h.colors[1] : '#222', hair: HAIR[hid] != null ? HAIR[hid] : (A.hash(hid) % 4) }, extra || {});
  }
  function enemyInfo(eid, extra) {
    const d = D.ENEMIES[eid];
    return Object.assign({ kind: 'enemy', woman: !!d.age, c1: d.colors[0], c2: d.colors[1], glyph: d.glyph, crown: !!d.boss && !!d.age, hair: A.hash(eid) % 4 }, extra || {});
  }
  function cardInfo(d) {
    const h = d.hero && D.HEROINES[d.hero];
    const col = h ? h.colors : (A.CLS_COL[d.cls] || A.CLS_COL.neutral);
    return { kind: 'card', type: d.type, c1: col[0], c2: d.rarity === 'legend' ? '#2a0a00' : col[1], woman: !!h, hair: h ? (HAIR[d.hero] != null ? HAIR[d.hero] : A.hash(d.hero) % 4) : 0, glyph: d.icon || '✦', fallback: null };
  }
  function galleryInfo(gid, extra) {
    const g = D.GALLERY[gid];
    if (g.hero) return heroInfo(g.hero, 'gallery', extra);
    if (g.enemy) return enemyInfo(g.enemy, Object.assign({ kind: 'gallery' }, extra));
    return Object.assign({ kind: 'gallery', party: gid === 'g_party', c1: '#ff9ec7', c2: '#1a0b2a', glyph: '✨' }, extra || {});
  }
  // 그림 박스: data-art 를 달아 두면 터치 시 크게 보기
  function artBox(key, info, cls, o) {
    o = o || {};
    const view = o.noView ? '' : `data-act="viewArt" data-key="${esc(key)}" data-info="${esc(JSON.stringify(info))}" data-cap="${esc(o.cap || '')}"`;
    return `<div class="artbox ${cls || ''}" ${view}>${A.html(key, info, { eager: o.eager })}</div>`;
  }
  function heroArt(hid, cls, o) { return artBox('hero:' + hid, heroInfo(hid, 'hero'), cls, Object.assign({ cap: D.HEROINES[hid] ? D.HEROINES[hid].name : '' }, o)); }
  function enemyArt(eid, cls, o) { return artBox('enemy:' + eid, enemyInfo(eid), cls, Object.assign({ cap: D.ENEMIES[eid].name }, o)); }

  const TYPE_KO = { attack: '공격', skill: '스킬', power: '파워', status: '상태', curse: '저주' };
  const RAR_KO = { starter: '기본', common: '일반', uncommon: '고급', rare: '희귀', legend: '전설', special: '특수', token: '토큰' };
  function cardHTML(card, o) {
    o = o || {};
    const d = E.cardDef(card);
    const h = d.hero && D.HEROINES[d.hero];
    const info = cardInfo(d); if (d.hero) info.fallback = 'hero:' + d.hero;
    const art = `<div class="art">${A.html('card:' + d.id, info)}</div>`;
    const cost = d.unplayable ? '' : `<div class="cost">${d.cost === -1 ? 'X' : d.cost}</div>`;
    const desc = E.describe(d, o.ctx);
    const cls = ['card', 't-' + d.type, 'r-' + d.rarity, card.up ? 'up' : '', o.big ? 'big' : '', o.cls || ''].join(' ');
    const attrs = o.act ? `data-act="${o.act}" ${Object.entries(o.data || {}).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ')}` : '';
    const syn = o.syn ? synBadge(d.id) : '';
    return `<div class="${cls}" ${attrs}>${cost}${art}<div class="cname">${esc(d.name)}</div><div class="chero">${h ? esc(h.name) : esc(RAR_KO[d.rarity] || '')}</div><div class="cdesc"><span>${desc}</span></div><div class="ctype">${TYPE_KO[d.type] || ''}</div>${syn}</div>`;
  }
  function synBadge(id) {
    if (!run) return '';
    const s = E.synergy(run, id);
    const best = s.tags.filter(x => x.n > 0);
    if (!best.length) return '';
    return `<div class="synbadge" title="덱 조합">🔗${best.map(x => (D.ARCH[x.t] ? D.ARCH[x.t].icon : '') + x.n).join(' ')}</div>`;
  }
  function chipsHTML(st, act) {
    return `<div class="chips">${Object.keys(st).filter(k => D.STATUS[k] && st[k]).map(k => {
      const s = D.STATUS[k];
      return `<span class="chip ${s.type}" data-act="status" data-s="${k}" data-v="${st[k]}">${s.icon}${s.flag ? '' : st[k]}</span>`;
    }).join('')}</div>`;
  }
  function hpBarHTML(hp, max, block) {
    return `<div class="hpwrap">${block ? `<div class="blockbadge">${block}</div>` : ''}<div class="hpbar ${block ? 'blocked' : ''}"><div class="fill" style="width:${Math.max(0, hp / max * 100)}%"></div><div class="txt">${hp} / ${max}</div></div></div>`;
  }

  // ───────── 상단 바 ─────────
  function topBar() {
    const node = run.pos && run.map.nodes[run.pos];
    const act = D.ACTS[run.act];
    const floorTxt = node ? (node.type === 'boss' ? '보스' : `${node.floor + 1}층`) : '출발';
    return `<div class="topbar">
      <button class="tb" data-act="menu" aria-label="메뉴">☰</button>
      <span class="tb hpt">❤️ ${run.hp}/${run.maxHp}</span>
      <span class="tb">💰 ${run.gold}</span>
      <span class="tb actt" title="${esc(act.name)}">${run.act < 4 ? run.act + '막' : '종막'}·${floorTxt}</span>
      ${run.asc ? `<span class="tb asct">🔥${run.asc}</span>` : ''}
      <span class="sp"></span>
      ${run.potions.map((p, i) => `<button class="tb potion-slot ${p ? 'full' : ''}" data-act="potion" data-slot="${i}" aria-label="물약">${p ? D.POTIONS[p].icon : ''}</button>`).join('')}
      <button class="tb" data-act="deck" aria-label="덱">🃏${run.deck.length}</button>
    </div>
    <div class="relicbar">${run.relics.map(r => `<button class="relic ${D.RELICS[r].boss ? 'bossr' : ''}" data-act="relic" data-id="${r}">${D.RELICS[r].icon}</button>`).join('') || '<span class="dim small">유물 없음</span>'}</div>`;
  }

  // ───────── 렌더 ─────────
  function render() {
    let html, scr;
    if (!run) { scr = ui.view; html = ({ pick: renderPick, title: renderTitle })[ui.view] ? ({ pick: renderPick, title: renderTitle })[ui.view]() : renderTitle(); }
    else {
      scr = (ui.hold && run.combat) ? 'combat' : run.screen;
      html = ({ map: renderMap, combat: renderCombat, reward: renderReward, rest: renderRest, shop: renderShop, event: renderEvent,
                treasure: renderTreasure, select: renderSelect, victory: renderEnd, gameover: renderEnd })[scr]();
    }
    const changed = scr !== ui.lastScreen; ui.lastScreen = scr;
    if (ui.modal) html += `<div class="modal-bg" data-act="closeModal"><div class="modal" data-act="noop">${ui.modal}</div></div>`;
    app.innerHTML = `<div class="screen ${changed && !reduced() ? 'enter' : ''} scr-${scr}" ${run && run.screen !== 'combat' ? `style="--actbg:${D.ACTS[run.act].bg[0]}"` : ''}>${html}</div>`;
    if (run && run.screen === 'map' && !ui.hold) scrollMap();
    if (run && (run.screen === 'combat' || ui.hold)) layoutHand();
  }

  function renderTitle() {
    const saved = loadJSON(SAVE_KEY);
    const ok = saved && !saved.over && saved.v === 2 && D.STARTERS[saved.starter];
    const achN = Object.keys(meta.ach).length, achT = Object.keys(D.ACHIEVEMENTS).length;
    const newG = meta.newGallery && meta.newGallery.length;
    return `<div class="scroll"><div class="title-screen">
      <div class="logo">미녀 덱<small>밤의 여왕</small></div>
      <div class="title-heroes">${Object.keys(D.STARTERS).map(id => E.heroUnlocked(meta, id)
        ? heroArt(id, 'th', { eager: true })
        : `<div class="artbox th locked" data-act="lockedHero">${A.html('hero:' + id, heroInfo(id, 'hero', { silhouette: true }))}<span class="lockq">?</span></div>`).join('')}</div>
      <div class="dim small">덱빌딩 로그라이트 · 숲과 밤의 성, 별의 첨탑을 지나 황혼의 여신에게</div>
      <div class="col" style="width:100%;max-width:320px">
        ${ok ? `<button class="btn primary block" data-act="continue">▶ 이어하기 <span class="small">(${esc(D.STARTERS[saved.starter].title)} · ${saved.act < 4 ? saved.act + '막' : '종막'})</span></button>` : ''}
        <button class="btn ${ok ? '' : 'primary'} block" data-act="newGame">⚔️ 새 원정 시작</button>
        <div class="row"><button class="btn block" data-act="codex">📖 도감${newG ? ' <span class="dot"></span>' : ''}</button><button class="btn block" data-act="achv">🏆 업적 ${achN}/${achT}</button></div>
        <div class="row"><button class="btn block" data-act="help">❔ 도움말</button><button class="btn block" data-act="settings">⚙️ 설정</button></div>
      </div>
      <div class="dim small">원정 ${meta.runs}회 · 클리어 ${meta.wins}회 · 최고 승천 ${Math.max(0, meta.ascMax - (meta.wins ? 1 : 0))}${meta.ascMax ? ` · 승천 ${meta.ascMax}까지 열림` : ''}</div>
      <div class="dim" style="font-size:11px">v${D.VERSION} · 모든 등장인물은 20대 이상의 성인입니다</div>
    </div></div>`;
  }

  function renderPick() {
    const asc = Math.min(settings.asc, meta.ascMax);
    const ascRow = meta.ascMax > 0 ? `<div class="panel col asc-panel">
        <div class="row" style="justify-content:space-between"><b>🔥 승천 ${asc}</b><span class="small dim">최대 ${meta.ascMax}</span></div>
        <div class="row"><button class="btn" data-act="asc" data-d="-1" ${asc <= 0 ? 'disabled' : ''}>−</button>
        <input type="range" min="0" max="${meta.ascMax}" value="${asc}" data-act="noop" id="ascr" aria-label="승천 단계">
        <button class="btn" data-act="asc" data-d="1" ${asc >= meta.ascMax ? 'disabled' : ''}>+</button></div>
        <div class="small asc-desc">${D.ASCENSION.slice(1, asc + 1).map((t, i) => `<div>${i + 1}. ${esc(t)}</div>`).join('') || '기본 난이도'}</div></div>`
      : `<div class="small dim center">한 번 클리어하면 🔥승천(난이도 1~10)이 열려.</div>`;
    return `<div class="topbar"><button class="tb" data-act="toTitle" aria-label="뒤로">←</button><span>히로인 선택</span></div>
    <div class="scroll"><div class="col pad">
      ${ascRow}
      ${Object.entries(D.STARTERS).map(([id, s]) => {
        const h = D.HEROINES[s.hero], r = D.RELICS[s.relic], wins = meta.heroWins[id] || 0;
        if (!E.heroUnlocked(meta, id)) return `<div class="panel col lockedpanel"><div class="hero-pick">
            <div class="artbox hp locked">${A.html('hero:' + id, heroInfo(id, 'hero', { silhouette: true }))}<span class="lockq">🔒</span></div>
            <div class="col" style="gap:6px"><h3>??? · ${esc(h.job)}</h3><div class="small">${esc(s.unlockText || '조건을 달성하면 합류해.')}</div></div></div></div>`;
        const arch = D.CLASS_ARCH[s.cls].map(t => `<span class="tag">${D.ARCH[t].icon} ${esc(D.ARCH[t].name)}</span>`).join('');
        return `<div class="panel col">
          <div class="hero-pick">${heroArt(s.hero, 'hp')}
            <div class="col" style="gap:4px">
              <h3>${esc(s.title)} ${wins ? `<span title="클리어">⭐${wins > 1 ? wins : ''}</span>` : ''}</h3>
              <div><span class="tag">${esc(h.job)}</span><span class="tag">${h.age}세</span><span class="tag">❤️ ${s.hp - (asc >= 6 ? 6 : 0)}</span>${meta.heroBestAsc[id] != null && wins ? `<span class="tag">🔥${meta.heroBestAsc[id]}</span>` : ''}</div>
              <div class="small">${esc(s.pitch)}</div>
              <div class="quote">“${esc(s.line)}”</div>
            </div></div>
          <div class="small"><b>${r.icon} ${esc(r.name)}</b> — ${esc(r.desc)}</div>
          <div class="archrow">${arch}</div>
          <div class="row"><button class="btn" data-act="previewDeck" data-id="${id}">시작 덱</button>
          <button class="btn primary" style="flex:1" data-act="pick" data-id="${id}">이 히로인으로 출발</button></div>
        </div>`;
      }).join('')}
    </div></div>`;
  }

  const NODE_ICON = { monster: '⚔️', elite: '😈', rest: '🔥', shop: '🛍️', event: '❓', treasure: '🎁', boss: '👑' };
  const NODE_NAME = { monster: '전투', elite: '엘리트', rest: '휴식', shop: '상점', event: '이벤트', treasure: '보물', boss: '보스' };
  const FH = 74;
  function renderMap() {
    const m = run.map, W = Math.min(window.innerWidth, 480) - 24, H = (m.floors + 1) * FH + 70;
    const avail = new Set(E.availableNodes(run));
    const pos = id => {
      const n = m.nodes[id];
      if (id === 'boss') return { x: W / 2, y: 56 };
      const jitter = ((n.floor * 7 + n.col * 13) % 5 - 2) * 4;
      return { x: 24 + (n.col + 0.5) * (W - 48) / m.width + jitter, y: H - 40 - n.floor * FH };
    };
    let lines = '';
    for (const n of Object.values(m.nodes)) for (const nx of n.next) {
      const a = pos(n.id), b = pos(nx);
      const walked = run.visited.includes(n.id) && run.visited.includes(nx);
      lines += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${walked ? '#ff6fa8' : '#5b3f7a'}" stroke-width="${walked ? 4 : 2}" stroke-dasharray="${walked ? '' : '5 5'}"/>`;
    }
    let nodes = '';
    const bossId = (D.ENCOUNTERS[run.act].boss[0] || [])[0];
    for (const n of Object.values(m.nodes)) {
      const p = pos(n.id);
      const cls = ['node', 'n-' + n.type, n.type === 'boss' ? 'boss' : '', run.visited.includes(n.id) ? 'visited' : '', run.pos === n.id ? 'current' : '', avail.has(n.id) ? 'avail' : 'locked'].join(' ');
      const inner = n.type === 'boss' && bossId ? `<span class="bossart">${A.html('enemy:' + bossId, enemyInfo(bossId))}</span>` : NODE_ICON[n.type];
      nodes += `<button class="${cls}" style="left:${p.x}px;top:${p.y}px" data-act="node" data-id="${n.id}" aria-label="${NODE_NAME[n.type]}">${inner}</button>`;
    }
    let labels = '';
    for (let f = 0; f < m.floors; f++) labels += `<div class="floorlbl" style="top:${H - 46 - f * FH}px">${f + 1}</div>`;
    const act = D.ACTS[run.act];
    return `${topBar()}
      <div class="actbar" style="background:linear-gradient(90deg,${act.bg[0]},${act.bg[1]})"><b>${esc(act.name)}</b><span class="small dim">보스: ${bossId ? esc(D.ENEMIES[bossId].name) : '?'}</span></div>
      <div class="scroll" id="mapscroll"><div class="map" style="width:${W}px;height:${H}px">${labels}<svg width="${W}" height="${H}">${lines}</svg>${nodes}</div></div>
      <div class="legend">${Object.keys(NODE_ICON).map(k => `<span>${NODE_ICON[k]} ${NODE_NAME[k]}</span>`).join('')}</div>`;
  }
  function scrollMap() {
    const sc = document.getElementById('mapscroll'); if (!sc) return;
    const a = sc.querySelector('.node.avail');
    if (a) sc.scrollTop = a.offsetTop - sc.clientHeight * 0.6;
    else sc.scrollTop = sc.scrollHeight;
  }

  // ───────── 전투 화면 ─────────
  const TUT = [
    { t: '👋 첫 전투야! 적 머리 위 아이콘은 <b>다음 행동 예고</b>야. ⚔️숫자만큼 때리려는 거야.', at: 'intent' },
    { t: '카드를 <b>터치해서 고르고</b>, 공격 카드는 <b>적을 터치</b>하면 써. (적이 하나면 카드를 한 번 더 터치)', at: 'hand' },
    { t: '왼쪽 아래 🟠는 <b>에너지</b>. 카드 왼쪽 위 숫자만큼 써. 매 턴 다시 차.', at: 'energy' },
    { t: '🛡️<b>방어도</b>는 들어오는 피해를 막아 줘. 다 썼으면 <b>턴 종료</b>! 카드를 길게 보고 싶으면 덱(🃏)에서 터치.', at: 'end' }
  ];
  function renderCombat() {
    const c = run.combat, P = c.p;
    const sel = ui.sel != null ? c.hand.find(x => x.uid === ui.sel) : null;
    const selDef = sel && E.cardDef(sel);
    const alive = E.aliveEnemies(run);
    const pot = ui.potionSel != null && D.POTIONS[run.potions[ui.potionSel]];
    const targeting = (selDef && E.needsTarget(selDef) && alive.length > 1) || (pot && pot.target && alive.length > 1);
    const enemies = c.enemies.map((e, i) => {
      if (e.dead) {
        if (ui.deadShown.has(e.uid)) return `<div class="enemy dead"></div>`;
        ui.deadShown.add(e.uid);
      }
      const d = D.ENEMIES[e.id];
      const iv = e.dead ? null : E.intentView(run, e);
      const intent = iv ? iv.parts.map(p => p.k === 'atk' ? `<span class="atk ${p.total >= 20 ? 'heavy' : ''}">🗡️${p.text}</span>` : p.k === 'def' ? '<span class="def">🛡️</span>' : p.k === 'buff' ? '<span class="buff">✨</span>' : p.k === 'debuff' ? '<span class="debuff">🌀</span>' : p.k === 'summon' ? '<span>📯</span>' : '❔').join('') : '';
      return `<div class="enemy ${d.boss ? 'boss' : ''} ${d.kind === 'elite' ? 'elite' : ''} ${e.dead ? 'dying' : ''} ${targeting && !e.dead ? 'targetable' : ''}" data-act="enemy" data-i="${i}" data-who="${e.uid}">
        <div class="intent" title="${iv ? esc(iv.name) : ''}">${intent}</div>
        <div class="eportrait">${A.html('enemy:' + e.id, enemyInfo(e.id))}</div>
        <div class="ename">${esc(e.name)}</div>
        ${hpBarHTML(e.hp, e.maxHp, e.block)}
        ${chipsHTML(e.st)}
      </div>`;
    }).join('');
    const sid = D.STARTERS[run.starter].hero, h = D.HEROINES[sid];
    let hint = '';
    if (sel) hint = targeting ? '공격할 적을 터치해!' : '한 번 더 터치하면 사용';
    else if (ui.potionSel != null) hint = '물약을 쓸 적을 터치해!';
    else if (!c.hand.some(cd => E.canPlay(run, cd))) hint = '낼 카드가 없어 → 턴 종료';
    const incoming = E.incomingDamage(run);
    const noMore = !c.hand.some(cd => E.canPlay(run, cd));
    const net = Math.max(0, incoming - P.block);
    const tut = !meta.tutorialDone && ui.tut < TUT.length ? `<div class="tutbox tut-${TUT[ui.tut].at}"><div>${TUT[ui.tut].t}</div><div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn sm ghost" data-act="tutSkip">건너뛰기</button><button class="btn sm primary" data-act="tutNext">${ui.tut === TUT.length - 1 ? '알겠어!' : '다음 ▶'} <span class="small">${ui.tut + 1}/${TUT.length}</span></button></div></div>` : '';
    return `${topBar()}
    <div class="battle" data-act="bg" style="--actbg:${D.ACTS[run.act].bg[0]}">
      <div class="enemies n${c.enemies.length}">${enemies}</div>
      <div class="player" data-who="p">
        <div class="pportrait" data-act="viewArt" data-key="hero:${sid}" data-info="${esc(JSON.stringify(heroInfo(sid, 'hero')))}" data-cap="${esc(h.name)}">${A.html('hero:' + sid, heroInfo(sid, 'hero'))}</div>
        <div class="pinfo"><div class="row" style="justify-content:space-between"><b>${esc(h.name)}</b>${incoming ? `<span class="small incoming ${net ? '' : 'safe'}">🗡️${incoming}${P.block ? ` − 🛡️${P.block}` : ''} → <b>${net ? '−' + net : '안전'}</b></span>` : '<span class="small dim">공격 예고 없음</span>'}</div>
        ${hpBarHTML(run.hp, run.maxHp, P.block)}${chipsHTML(P.st, true)}</div>
      </div>
      <div class="controls">
        <div class="energy ${c.energy ? '' : 'zero'}">${c.energy}/${E.maxEnergy(run)}</div>
        <button class="pilebtn" data-act="pile" data-w="draw" aria-label="뽑을 더미">📚${c.draw.length}</button>
        <div class="hint">${hint}</div>
        <button class="pilebtn" data-act="pile" data-w="disc" aria-label="버린 더미">🗑️${c.disc.length}</button>
        ${c.exh.length ? `<button class="pilebtn" data-act="pile" data-w="exh" style="min-width:40px" aria-label="소멸">🔥${c.exh.length}</button>` : ''}
        <button class="endturn ${noMore ? 'glow' : ''}" data-act="endTurn">턴 종료</button>
      </div>
      ${tut}
    </div>
    <div class="hand ${ui.deal ? 'deal' : ''}" id="hand">${c.hand.map((cd, i) => cardHTML(cd, { act: 'card', data: { uid: cd.uid }, ctx: { p: P }, cls: (cd.uid === ui.sel ? 'sel ' : '') + (E.canPlay(run, cd) ? 'playable' : 'unplayable') }).replace('<div class="card', `<div style="--i:${i}" class="card`)).join('')}</div>
`;
  }
  function layoutHand() {
    const hand = document.getElementById('hand'); if (!hand) return;
    const n = hand.children.length; if (!n) return;
    const cw = 100, avail = hand.clientWidth - 12;
    const ov = n * cw > avail ? -((n * cw - avail) / (n - 1)) : 2;
    hand.style.setProperty('--ov', ov + 'px');
    ui.deal = false;
  }

  // ───────── 보상 ─────────
  function renderReward() {
    const r = run.rewards;
    const items = [];
    if (r.bossRelics && !r.bossRelicTaken) {

      if (ev.gotPotion2) got.push(`${D.POTIONS[ev.gotPotion2].icon} ${esc(D.POTIONS[ev.gotPotion2].name)} 획득`);

  function closeModal() { ui.modal = ui.modalStack.pop() || null; render(); }
  function deckModal(cards, title, sortIt) {
    const list = sortIt === false ? cards : cards.slice().sort((a, b) => (a.id > b.id ? 1 : -1));
    return `<h2>${esc(title)} (${cards.length})</h2><div class="small dim">카드를 터치하면 크게 보기 + 강화 비교</div><div class="grid" style="padding:4px 0">${list.map(cd => cardHTML(cd, { act: 'cardInfo', data: { id: cd.id, up: cd.up ? 1 : 0 } })).join('') || '<div class="dim">비어 있어</div>'}</div><button class="btn block" data-act="closeModal">닫기</button>`;
  }
  // 카드 크게 보기: 일러스트 전체 + 설명 + 강화 비교 + 조합 태그
  function cardDetail(card, actions) {
    const d = E.cardDef(card), base = D.CARDS[card.id];
    const info = cardInfo(d); if (d.hero) info.fallback = 'hero:' + d.hero;
    const h = d.hero && D.HEROINES[d.hero];
    let up = '';
    if (E.canUpgrade({ id: card.id, up: false }) && D.CARDS[card.id].up) {
      const df = E.upgradeDiff(card.id);
      up = `<div class="panel diffpanel"><b>${card.up ? '✅ 강화됨' : '⚒️ 강화(+)하면'}</b>
        <div class="small diffline">${df.cost ? `<span class="tag">비용 ${esc(df.cost)}</span>` : ''}${df.changes.map(x => `<span class="tag up">${esc(x)}</span>`).join('')}</div>
        <div class="small">${df.html}</div>${card.up ? `<div class="small dim">강화 전: ${esc(df.before)}</div>` : ''}</div>`;
    }
    const tags = (base.tags || []).filter(t => D.ARCH[t]).map(t => {
      const n = run ? (E.synergy(run, card.id).tags.find(x => x.t === t) || { n: 0 }).n : 0;
      return `<span class="tag">${D.ARCH[t].icon} ${esc(D.ARCH[t].name)}${run && n ? ` · 내 덱 ${n}장` : ''}</span>`;
    }).join('');
    const unlock = base.unlock && D.ACHIEVEMENTS[base.unlock] ? `<div class="small" style="color:var(--gold)">🏆 해금: ${esc(D.ACHIEVEMENTS[base.unlock].name)} — ${esc(D.ACHIEVEMENTS[base.unlock].desc)}</div>` : '';
    return `<div class="cdetail">
      <div class="cd-art" data-act="viewArt" data-key="card:${esc(card.id)}" data-info="${esc(JSON.stringify(info))}" data-cap="${esc(d.name)}">${A.html('card:' + card.id, info, { eager: true })}<span class="zoom">🔍</span></div>
      <div class="col" style="gap:6px;flex:1;min-width:0">
        <div class="cd-cost ${'t-' + d.type}">${d.unplayable ? '—' : d.cost === -1 ? 'X' : d.cost}</div>
        <h2 class="${card.up ? 'upname' : ''}">${esc(d.name)}</h2>
        <div><span class="tag">${TYPE_KO[d.type] || ''}</span><span class="tag r-${d.rarity}">${RAR_KO[d.rarity] || ''}</span>${h ? `<span class="tag">${esc(h.name)} · ${h.age}세</span>` : ''}</div>
        <div class="cd-desc">${E.describe(d, run && run.combat ? { p: run.combat.p } : null)}</div>
        ${base.quote ? `<div class="quote">“${esc(base.quote)}”</div>` : ''}
      </div></div>
      ${tags ? `<div class="archrow">${tags}</div>` : ''}${unlock}${up}
      ${actions || ''}<button class="btn block" data-act="closeModal">닫기</button>`;
  }

      ${row('reduce', '🧘 움직임 줄이기', '화면 흔들림·카드 날아가기 같은 연출을 줄여')}
